<title>Huyền Ấn Chiến Bài</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen phone game. Header / tilted 2.5D stone board / info strip / hand. Single dark-fantasy world by choice: ash, iron, worn gold, ember. */
:root{
  color-scheme:dark;
  --bg:#05070d; --bg2:#0b1020; --panel:#0d1322; --line:#1c3248;
  --fg:#d7e6f5; --dim:#7d8fa8;
  --gold:#29e6ff; --ember:#ff3fa4; --blood:#ff3f6e; --moon:#29d3ff; --good:#7dff9a; --bad:#ff4d6d;
  --r0:#8a94a8; --r1:#3aa0ff; --r2:#b26bff; --r3:#ffd34d;--r4:#ff3f8e;
  --display:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --body:'Be Vietnam Pro',system-ui,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(90% 55% at 50% 38%,#12182a 0%,#0a0e19 45%,var(--bg) 80%) fixed var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent;user-select:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 6px #000b;z-index:30}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,.cell:focus-visible{outline:1px solid var(--gold);outline-offset:2px}
h1,h2{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
.screen{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:10px;position:relative;z-index:1}
.scroll{overflow-y:auto;flex:1;min-height:0}
.btn{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);padding:10px 14px;
  background:linear-gradient(180deg,#111832,#090c16);border:1px solid #1f6f86;box-shadow:inset 0 0 0 1px #000,0 4px 12px #000a}
.btn:active{background:#132036}
.btn.ghost{color:var(--fg);border-color:var(--line)}
.btn[disabled]{opacity:.4;pointer-events:none}
.pill{display:inline-flex;gap:6px;align-items:center;border-bottom:1px solid var(--line);padding:4px 2px;font-variant-numeric:tabular-nums;color:var(--fg);letter-spacing:.06em;text-transform:uppercase;font-size:12px}
.pill b{color:var(--gold);font-size:16px;font-family:var(--display)}
.dim{color:var(--dim)}
.row{display:flex;gap:8px;align-items:center}
.sp{flex:1}

/* ---------- card ---------- */
.card{container-type:inline-size;position:relative;width:100%;aspect-ratio:5/6;--own:var(--moon);--rc:var(--r0);--ec:#888}
.card.o-e{--own:var(--blood)}
.card.r1{--rc:var(--r1)}.card.r2{--rc:var(--r2)}.card.r3{--rc:var(--r3)}.card.r4{--rc:var(--r4)}
.e-hoa{--ec:#ff7a2f}.e-thuy{--ec:#3fd8ff}.e-moc{--ec:#7dff6a}.e-quang{--ec:#bff8ff}.e-am{--ec:#8f6ad0}
.cf{position:absolute;inset:0;border-radius:5cqw;border:2.4cqw solid;border-color:color-mix(in srgb,var(--rc) 85%,#fff) color-mix(in srgb,var(--rc) 55%,#000) color-mix(in srgb,var(--rc) 35%,#000);
  background:linear-gradient(180deg,#26211a,#0d0b08);box-shadow:0 0 0 1cqw #000,0 0 0 3cqw var(--own),0 0 8cqw color-mix(in srgb,var(--rc) 45%,transparent);overflow:hidden}
.art{position:absolute;inset:8% 8% 8% 8%;border-radius:46% 46% 6% 6%/34% 34% 6% 6%;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(60% 50% at 50% 46%,color-mix(in srgb,var(--ec) 85%,#fff) 0%,color-mix(in srgb,var(--ec) 55%,#000) 38%,#060810 78%);
  box-shadow:inset 0 0 0 1.2cqw #000,inset 0 0 0 2cqw color-mix(in srgb,var(--rc) 50%,#000),inset 0 -16cqw 18cqw #000c}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,#000b),repeating-linear-gradient(100deg,#0000 0 5cqw,#0002 5cqw 6cqw)}
.emo{font-size:46cqw;line-height:1;color:transparent;text-shadow:0 0 0 #05070d;filter:drop-shadow(0 0 3cqw color-mix(in srgb,var(--ec) 70%,#fff)) drop-shadow(0 3cqw 2cqw #000)}
.evo .emo{font-size:54cqw;filter:drop-shadow(0 0 6cqw #fff) drop-shadow(0 3cqw 2cqw #000)}
.v{position:absolute;width:25cqw;height:25cqw;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-weight:700;font-size:21cqw;line-height:1;
  background:color-mix(in srgb,var(--own) 62%,#000);color:#fff;border:1.4cqw solid color-mix(in srgb,var(--own) 70%,#fff);text-shadow:0 0 2cqw #000;font-variant-numeric:lining-nums tabular-nums;z-index:2;border-radius:3cqw;transform-origin:center;box-shadow:0 0 0 .8cqw #000}
.v0{top:0;left:50%;transform:translateX(-50%) rotate(45deg) scale(.82)}.v2{bottom:0;left:50%;transform:translateX(-50%) rotate(45deg) scale(.82)}
.v1{right:0;top:50%;transform:translateY(-50%) rotate(45deg) scale(.82)}.v3{left:0;top:50%;transform:translateY(-50%) rotate(45deg) scale(.82)}
.v>b{transform:rotate(-45deg) scale(1.2);font-weight:700}
.v.up{color:#c8f59a}.v.dn{color:#ffb3a0}
.gem{position:absolute;top:3%;left:5%;font-size:13cqw;z-index:2;color:transparent;text-shadow:0 0 0 var(--ec);filter:drop-shadow(0 0 1cqw #000)}
.stars{position:absolute;top:3.5%;right:6%;font-size:8cqw;color:var(--rc);letter-spacing:-.5cqw;z-index:2;text-shadow:0 0 2cqw #000}
.foil{position:absolute;inset:0;background:linear-gradient(115deg,transparent 34%,#fff5 47%,#29e6ff55 52%,transparent 64%);background-size:260% 100%;mix-blend-mode:screen;animation:foil 4s linear infinite;pointer-events:none}
.r3 .foil{background-image:linear-gradient(115deg,transparent 28%,#bff8ffaa 45%,#fff8 50%,#ff3fa466 56%,transparent 72%);animation-duration:2.8s}
@keyframes foil{from{background-position:130% 0}to{background-position:-130% 0}}
.st{position:absolute;bottom:12%;right:10%;font-size:17cqw;z-index:3;animation:bob .7s ease-in-out infinite alternate}
.st.l{right:auto;left:10%}
@keyframes bob{to{transform:translateY(-6%) scale(1.1)}}
.frozen .cf::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#cfe6f0aa,#7fa9c055 40%,#ffffff77 60%,#9fc4d877);mix-blend-mode:screen}
.shield .cf{box-shadow:0 0 0 1cqw #000,0 0 0 2cqw color-mix(in srgb,var(--own) 80%,#000),0 0 0 3.4cqw #bff8ff77,0 0 12cqw #bff8ff}
.burning .cf{box-shadow:0 0 0 1cqw #000,0 0 0 2cqw color-mix(in srgb,var(--own) 80%,#000),0 0 14cqw #ff7a2f}
.back .cf{background:radial-gradient(circle,#12182a,#070a12 70%);border-color:#1f6f86}
.back .cf::after{content:"";position:absolute;inset:22% 26%;border:2cqw solid #1f6f86;border-radius:50%;box-shadow:0 0 0 5cqw #070a12,0 0 0 6.5cqw #1b3a4a,0 0 10cqw #29e6ff66}

/* ---------- home ---------- */
.hero{text-align:center;padding-top:10px}
.hero h1{font-size:46px;line-height:1;color:var(--gold);letter-spacing:.16em;text-transform:uppercase;font-weight:500;text-shadow:0 0 30px #29e6ff55,0 2px 0 #000}
.hero p{margin:6px 0 0;letter-spacing:.42em;text-transform:uppercase;font-size:11px;color:var(--dim)}
.hero p::before,.hero p::after{content:"";display:inline-block;width:34px;height:1px;background:var(--line);vertical-align:middle;margin:0 10px}
.fan{display:flex;justify-content:center;height:128px;align-items:flex-end;margin-top:8px}
.fan>div{width:84px;margin:0 -8px}
.fan>div:nth-child(1){transform:rotate(-9deg) translateY(8px)}
.fan>div:nth-child(3){transform:rotate(9deg) translateY(8px)}
.fan>div:nth-child(2){z-index:2;width:98px}
.opps{display:grid;gap:8px}
.opp{display:flex;gap:12px;align-items:center;text-align:left;background:linear-gradient(90deg,#0f1424,#080b14);border:1px solid var(--line);padding:10px 12px}
.opp:active{border-color:var(--gold)}
.opp .av{font-size:26px;width:46px;height:46px;display:grid;place-items:center;border:1px solid #5a1a3a;background:radial-gradient(circle,#3a0f2a,#070a12 75%);color:transparent;text-shadow:0 0 0 #05070d;transform:rotate(45deg)}
.opp .av i{font-style:normal;transform:rotate(-45deg);filter:drop-shadow(0 0 3px #ff4d6d)}
.opp b{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:.04em}.opp .dim{font-size:13px}
.opp.locked{opacity:.38}
.opp.boss{border-color:#7a1a4a;background:linear-gradient(90deg,#1a0a24,#080b14)}
.opp.boss b{color:var(--bad);letter-spacing:.1em;text-transform:uppercase}
.sil .emo{opacity:.55}
.sect{font-family:var(--display);font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:4px 0 0;border-bottom:1px solid var(--line);padding-bottom:4px}

/* ---------- match ---------- */
.top{display:flex;align-items:center;gap:8px}
.score{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:lining-nums tabular-nums}
.score .p{color:var(--moon)}.score .e{color:var(--bad)}
.who{font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:3px 0;border-bottom:1px solid var(--line)}
.who.p{border-color:var(--moon);color:var(--moon)}.who.e{border-color:var(--blood);color:var(--bad)}

.who{white-space:nowrap}
.stage{flex:1;min-height:0;display:grid;place-items:center;perspective:900px;perspective-origin:50% 10%}
.board{width:min(100%,430px,calc((100dvh - 330px)*.82));aspect-ratio:1/1.2;display:grid;grid-template-columns:repeat(4,1fr);gap:1.6%;padding:2.6%;
  transform:rotateX(34deg);transform-style:preserve-3d;
  background:linear-gradient(180deg,#121a2c,#080c16);box-shadow:0 14px 0 #02040a,0 0 0 2px #1b3a4a,0 50px 60px #000,0 0 80px #ff3fa422}
.board.shake{animation:shake .45s}
@keyframes shake{20%{transform:rotateX(34deg) translate(-6px,3px)}40%{transform:rotateX(34deg) translate(6px,-3px)}60%{transform:rotateX(34deg) translate(-4px,2px)}80%{transform:rotateX(34deg) translate(3px,0)}}
.cell{position:relative;transform-style:preserve-3d;transform:translateZ(1px);
  background:linear-gradient(150deg,#1c2740,#151b2a 60%,#0d1220),#151b2a;box-shadow:inset 0 0 0 1px #2a4a6a55,inset 2px 2px 0 #3a6a8a33,inset -3px -5px 10px #0008}
.cell.t-none::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 47%,#0006 48%,transparent 50%) 30% 0/70% 60% no-repeat,linear-gradient(60deg,transparent 48%,#0005 49%,transparent 51%) 80% 90%/50% 50% no-repeat}
.cell.t-ice{background:linear-gradient(150deg,#c6d9df,#7f9fae 50%,#3f5868);box-shadow:inset 0 0 0 1px #e6f2f5aa,inset 0 0 18px #fff6}
.cell.t-ice::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,#fff7 42%,transparent 46%),linear-gradient(60deg,transparent 60%,#fff5 62%,transparent 65%)}
.cell.t-lava{background:radial-gradient(circle at 35% 40%,#ff9a3a,#c9521d 40%,#2a0a3a 85%);box-shadow:inset 0 0 0 1px #ff7a2f,0 0 18px #ff7a2f77;animation:lava 1.8s ease-in-out infinite alternate}
@keyframes lava{to{filter:brightness(1.3)}}
.cell.t-rune{background:radial-gradient(circle,#124a5a,#151b2a 70%);box-shadow:inset 0 0 0 1px var(--gold),0 0 14px #29e6ff66}
.cell.t-rune::before{content:"";position:absolute;inset:26%;border:1px solid var(--gold);border-radius:50%;box-shadow:0 0 10px var(--gold),inset 0 0 10px var(--gold)}
.cell.t-rune::after{content:"";position:absolute;left:50%;top:14%;bottom:14%;width:1px;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.cell.t-rock{background:#060810}
.board.picking .cell.ok{box-shadow:inset 0 0 0 1px var(--gold),inset 0 0 14px #29e6ff88;cursor:pointer}
.slot{pointer-events:none;position:absolute;inset:3%;transform:translateZ(8px) rotateX(-16deg);transform-origin:50% 100%}
.slot.a-drop{animation:drop .38s cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{from{transform:translateZ(150px) rotateX(-16deg);opacity:0}}
.card.a-flip{animation:flip .42s ease-out}
@keyframes flip{from{transform:rotateY(180deg) scale(1.25)}}
.card.a-pulse{animation:pulse .36s}
@keyframes pulse{40%{transform:scale(1.18)}}
.warnmark{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px;color:#ffd0e0;background:repeating-linear-gradient(45deg,#b3261e77 0 8px,transparent 8px 16px);animation:blink .8s steps(2) infinite;z-index:4;pointer-events:none;text-shadow:0 1px 2px #000}
@keyframes blink{50%{opacity:.45}}
.info{min-height:90px;background:linear-gradient(180deg,#0c111e,#0a0d17);border:1px solid var(--line);padding:8px 12px;font-size:14px;line-height:1.35}
.info .nm{font-family:var(--display);font-weight:700;font-size:19px;color:var(--gold);margin-right:8px;letter-spacing:.04em}
.tag{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:0 6px;border:1px solid currentColor;margin-right:4px}
.tag.r0{color:var(--r0)}.tag.r1{color:var(--r1)}.tag.r2{color:var(--r2)}.tag.r3{color:var(--r3)}.tag.r4{color:var(--r4)}
.hand{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;min-height:70px}
.hc{padding:0;transition:transform .15s}
.hc.sel{transform:translateY(-10px) scale(1.08);filter:drop-shadow(0 0 8px var(--gold))}

/* ---------- collection / gacha ---------- */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 10px;padding:6px 4px 14px}
.gc{position:relative;padding:0}
.gc.in::after{content:"Ra trận";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);background:#070a12;border:1px solid var(--gold);color:var(--gold);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:0 5px;white-space:nowrap;z-index:5}
.gc .cost{position:absolute;top:-6px;right:-4px;z-index:5;background:#070a12;border:1px solid var(--line);color:var(--fg);font-family:var(--display);font-weight:700;font-size:13px;width:20px;height:20px;display:grid;place-items:center;border-radius:50%}
.gc.cursed{filter:saturate(.3) brightness(.7)}
table.rates{width:100%;border-collapse:collapse;font-size:14px}
table.rates td{padding:7px 4px;border-bottom:1px solid #ffffff10}
table.rates td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.reveal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.reveal .nm2{text-align:center;font-size:13px;margin-top:6px;min-height:2.8em;font-family:var(--display);font-weight:600}

/* ---------- modal / fx ---------- */
#modal{position:fixed;inset:0;background:#000000d9;display:grid;place-items:center;z-index:50;padding:16px}
.box{width:min(100%,430px);max-height:92%;overflow:auto;background:linear-gradient(180deg,#0f1424,#0a0d17);border:1px solid #1f6f86;box-shadow:0 0 0 1px #000,0 0 0 4px #0c111e,0 0 0 5px #1a2c44,0 20px 60px #000;padding:18px}
.box h2{font-size:26px;color:var(--gold);text-align:center;margin-bottom:8px;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
.box h2.lose{color:var(--bad)}
.box p{margin:6px 0;line-height:1.45}
.box ul{margin:6px 0;padding-left:18px;line-height:1.45}
.choices{display:grid;gap:8px;margin-top:10px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;background:#0006;border:1px solid var(--line);padding:10px}
.choice:active{border-color:var(--gold)}
.choice>span{font-size:24px;color:transparent;text-shadow:0 0 0 var(--gold)}
.choice b{font-family:var(--display);font-size:18px;letter-spacing:.04em}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.pbox{aspect-ratio:1/1.15;background:linear-gradient(180deg,#1a0a28,#070a12);border:1px solid #1f6f86;box-shadow:inset 0 0 0 3px #070a12,inset 0 0 0 4px #1a2c44,0 0 22px #b3261e55;font-size:38px;color:var(--gold);font-family:var(--display);display:grid;place-items:center;animation:bob 1.2s ease-in-out infinite alternate;padding:6px}
.pbox:nth-child(2){animation-delay:.3s}.pbox:nth-child(3){animation-delay:.6s}
.pbox.open{animation:none;background:#0008;font-size:13px;font-family:var(--body);color:var(--dim)}
.pbox.open span{font-size:28px;display:block;color:transparent;text-shadow:0 0 0 var(--gold)}
.pbox.mine{border-color:var(--bad);box-shadow:0 0 24px var(--blood);color:var(--fg)}
#banner{position:fixed;left:0;right:0;top:38%;z-index:60;text-align:center;padding:22px 0;background:linear-gradient(90deg,transparent,#000e 20%,#000e 80%,transparent);font-family:var(--display);font-weight:500;font-size:44px;letter-spacing:.3em;text-transform:uppercase;pointer-events:none;animation:ban 2.2s ease-out forwards}
#banner.lose{color:#ff3f6e;text-shadow:0 0 24px #b3261e88}
#banner.win{color:var(--gold);text-shadow:0 0 24px #29e6ff88}
@keyframes ban{from{opacity:0;letter-spacing:.16em}25%{opacity:1}80%{opacity:1}to{opacity:0;letter-spacing:.36em}}
#pc,#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
#fx{z-index:70}
#pc{width:100%;height:100%}
.ft{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.04em;text-shadow:0 2px 0 #000,0 0 10px #000;animation:ft 1s ease-out forwards;white-space:nowrap}
@keyframes ft{from{opacity:0;margin-top:10px;scale:.6}20%{opacity:1;scale:1.15}to{opacity:0;margin-top:-54px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
/* ---------- icon art, obstacles, preview ---------- */
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.12em;flex:none}
.art{background:radial-gradient(62% 52% at 50% 48%,color-mix(in srgb,var(--ec) 55%,#000) 0%,color-mix(in srgb,var(--ec) 22%,#000) 45%,#05070d 82%)}
.ic.emo{width:64cqw;height:64cqw;color:color-mix(in srgb,var(--ec) 24%,#e6f4ff);text-shadow:none;position:relative;z-index:1;filter:drop-shadow(0 0 3cqw color-mix(in srgb,var(--ec) 85%,#000)) drop-shadow(0 2.5cqw 1.5cqw #000)}
.evo .ic.emo{width:74cqw;height:74cqw;filter:drop-shadow(0 0 5cqw #fff8) drop-shadow(0 2.5cqw 1.5cqw #000)}
.sil .ic.emo{opacity:.45}
.ic.gem{position:absolute;top:3.5%;left:5%;width:14cqw;height:14cqw;color:var(--ec);text-shadow:none;filter:drop-shadow(0 0 1cqw #000)}
.ic.st{position:absolute;bottom:13%;right:11%;width:20cqw;height:20cqw;color:#e6f4ff;z-index:3;filter:drop-shadow(0 0 2cqw #000);animation:none}
.cell.t-tree,.cell.t-rock{background:linear-gradient(150deg,#111827,#12100c);box-shadow:inset 0 0 0 1px #000,inset 0 0 18px #000}
.obst{position:absolute;inset:0;display:grid;place-items:end center;pointer-events:none;transform:translateZ(2px) rotateX(-34deg);transform-origin:50% 100%}
.obst .ic{width:92%;height:auto;aspect-ratio:1;filter:drop-shadow(0 6px 4px #000)}
.obst.tree .ic{color:#9fe8ff;width:80%;filter:drop-shadow(0 0 8px #29e6ff) drop-shadow(0 6px 4px #000)}
.obst.rock .ic{color:#8a93a3;width:78%}
.obst.fire .ic{color:#ff8a3a;width:80%;filter:drop-shadow(0 0 8px #ff5a1f) drop-shadow(0 6px 4px #000);animation:wisp 1.4s ease-in-out infinite alternate}
@keyframes wisp{to{filter:drop-shadow(0 0 16px #ff5a1f) drop-shadow(0 6px 4px #000)}}
.board.picking .cell.ok[data-fc]::after{content:"Lật " attr(data-fc);position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:21px;color:#bff8ff;text-shadow:0 1px 3px #000,0 0 10px #29e6ff;pointer-events:none}
.cell.prev{box-shadow:inset 0 0 0 2px var(--gold),0 0 18px #29e6ff99!important}
.slot.ghost{opacity:.82}
.card.willflip .cf{animation:wf .5s ease-in-out infinite alternate}
@keyframes wf{from{box-shadow:0 0 0 1cqw #000,0 0 0 3cqw var(--blood)}to{box-shadow:0 0 0 1cqw #000,0 0 0 5cqw var(--moon),0 0 16cqw var(--moon)}}
.cmp{font-family:var(--display);font-weight:700;font-size:14px;line-height:1;white-space:nowrap;padding:3px 6px;background:#070a12;border:1px solid var(--line);color:var(--dim);font-variant-numeric:lining-nums;z-index:6;pointer-events:none}
.cmp.win{color:#070a12;background:var(--gold);border-color:#d0fbff}

const N=4,DX=[0,1,0,-1],DY=[-1,0,1,0];
const nb=(i,d)=>{const x=i%N+DX[d],y=(i/N|0)+DY[d];return x<0||y<0||x>=N||y>=N?-1:y*N+x};
const ev=(L,S,i,o)=>{if(L)L.push(Object.assign({i,snap:clone(S.cells[i])},o))};
const sk=(c,k)=>CARDS[c.id].k===k&&!c.sil;

function bump(S,i,d,L,o){const c=S.cells[i].card;if(!c)return;c.v=c.v.map(x=>Math.max(1,Math.min(10,x+d)));
 ev(L,S,i,Object.assign({txt:(d>0?'+':'−')+Math.abs(d),col:d>0?'#7dff9a':'#ff4d6d',anim:'pulse',wait:260},o))}
function adj(S,i,f){const r=[];for(let d=0;d<4;d++){const j=nb(i,d);if(j>=0&&S.cells[j].card&&f(S.cells[j].card))r.push(j)}return r}

 h.slice().sort((a,b)=>CARDS[a.id].r-CARDS[b.id].r).slice(0,n||0).forEach(c=>{c.v=c.v.map(x=>Math.max(1,x-1));c.b=[...c.v]})}

/* T: cổng chặn thao tác khi đang hướng dẫn, và hàng đợi sự kiện để kịch bản chờ người chơi làm đúng. */
const T={on:false,tutorial:false,hand:null,cell:null,place:true,waits:[],
 okHand(i){return this.hand==null||this.hand===i},okCell(i){return this.cell==null||this.cell===i},
 emit(ev,v){this.waits=this.waits.filter(w=>{if(w.ev===ev&&(w.v==null||w.v===v)){w.res(v);return false}return true})},
 wait(ev,v){return new Promise(res=>this.waits.push({ev,v,res}))},
 nudge(){sfx('err');const b=$('#cbub');b.classList.remove('nudge');void b.offsetWidth;b.classList.add('nudge')}};
let coachTgt=null;
function coachEl(){const t=coachTgt;return!t?null:typeof t==='function'?t():typeof t==='string'?$(t):t}
function coach(sel,html,btn){const c=$('#coach');c.hidden=false;coachTgt=sel;$('#cbub p').innerHTML=html;$('#cNext').hidden=!btn;if(btn)$('#cNext').textContent=btn;$('#cSkip').hidden=!T.tutorial;coachPos();return btn?T.wait('next'):Promise.resolve()}
function coachOff(){const c=$('#coach');if(c)c.hidden=true;coachTgt=null}
function coachPos(){const c=$('#coach');if(!c||c.hidden)return;const el=coachEl(),sp=$('#spot'),bub=$('#cbub'),bw=bub.offsetWidth,bh=bub.offsetHeight;
 c.classList.toggle('full',!el);
 if(!el){sp.style.display='none';bub.style.left=(innerWidth-bw)/2+'px';bub.style.top=Math.max(12,innerHeight*.42-bh/2)+'px';return}
 const r=el.getBoundingClientRect(),pad=6;sp.style.display='block';Object.assign(sp.style,{left:r.left-pad+'px',top:r.top-pad+'px',width:r.width+pad*2+'px',height:r.height+pad*2+'px'});
 const below=r.bottom+pad+14+bh<innerHeight-8&&!(r.top>innerHeight*.55);bub.classList.toggle('up',!below);
 bub.style.top=(below?r.bottom+pad+14:Math.max(8,r.top-pad-14-bh))+'px';
 const left=Math.min(Math.max(10,r.left+r.width/2-bw/2),innerWidth-bw-10);bub.style.left=left+'px';bub.style.setProperty('--ax',Math.max(14,Math.min(bw-14,r.left+r.width/2-left))+'px')}
(function loop(){requestAnimationFrame(loop);coachPos()})();
$('#cNext').onclick=()=>{sfx('tap');T.emit('next')};
function endTut(){T.tutorial=false;T.on=false;T.hand=T.cell=null;T.place=true;coachOff();if(M)M.pause=null}
$('#cSkip').onclick=()=>{SV.tut=1;save();endTut();const w=T.waits;T.waits=[];w.forEach(x=>x.res('skip'))};

/* Đối thủ đi theo kịch bản khi có, không thì để máy tự nghĩ. */
function nextBot(){if(M.script&&M.script.length){const[id,c]=M.script.shift();const hi=M.S.hands.e.findIndex(x=>x.id===id);if(hi>=0&&isFree(M.S.cells[c]))return[hi,c]}return botMove(M.S,M.opp)}

function enterMatch(opp){const b=$('#board');b.innerHTML='';cellEls=[];for(let i=0;i<16;i++){const d=document.createElement('div');d.className='cell';d.dataset.i=i;b.append(d);cellEls.push(d)}
 $('#mAv').src=ART[opp.av];$('#mName').textContent=opp.n;$('#legend').innerHTML=(M.S.el?triHTML()+'<span class="dim">+1</span>':'')+M.S.rules.map(r=>`<button class="rchip" data-r="${r}">${RULE[r].n}</button>`).join('');
 show('match');renderAll();fitBoard();taunt(opp.say&&opp.say[0])}
function taunt(t){const o=$('#taunt');if(o)o.remove();if(!t)return;const d=document.createElement('div');d.id='taunt';d.textContent='“'+t+'”';$('#match').append(d);setTimeout(()=>d.remove(),3600)}
const quote=(o,k)=>o&&o.say?`<p class="quote"><img src="${ART[o.av]}" alt="">“${o.say[k]}”</p>`:'';

/* Trận hướng dẫn: bàn và bài cố định, hai nước đầu của đối thủ theo kịch bản. */
async function runTutorial(){
 const eids=['scarab','croc','horse','rat','mud','ant'],pd=['boar','bear','falcon','ant','stoat','seahorse'].map(id=>inst(id,'p')),ed=eids.map(id=>inst(id,'e'));ed.push(inst('soul','e'));ed.forEach(c=>{if(c.id!=='scarab'&&c.id!=='croc'){c.v=c.v.map(x=>Math.max(1,x-1));c.b=[...c.v]}});
 const S=newState(pd,ed,{el:0});S.cells.forEach(c=>c.t='none');S.cells[0].t='rock';S.cells[7].t='tree';S.cells[12].t='rock';
 if(!SV.seen.includes(0))SV.seen.push(0);
 M={S,opp:OPPS[0],ix:0,bet:0,mult:1,tut:1,last:null,eIds:eids,turn:'e',sel:null,prev:null,busy:true,script:[['scarab',5],['croc',13]]};
 T.tutorial=true;T.on=true;T.hand=-1;T.cell=-1;T.place=false;T.waits=[];
 enterMatch(OPPS[0]);$('#info').innerHTML='<span class="nm">Trận hướng dẫn</span><div>Trận này không mất xu.</div>';
 const alive=()=>T.tutorial&&M&&M.tut;
 const pickThenPlace=async(hi,cell,cellText,placeText)=>{
  T.hand=hi;T.cell=-1;T.place=false;coach(()=>$$('#hand .hc')[hi],`Chạm vào lá <b>${CARDS[M.S.hands.p[hi].id].n}</b> trên tay bạn.`);
  if(M.sel!==hi)await T.wait('sel',hi);if(!alive())return;
  T.cell=cell;coach(()=>cellEls[cell],cellText);
  const r=await Promise.race([T.wait('prev',cell).then(()=>'prev'),T.wait('placed').then(()=>'placed')]);if(!alive()||r==='placed')return;
  T.place=true;coach('#bPlace',placeText);await T.wait('placed')};
 await coach(null,'<b class="who">Hướng dẫn</b>Chào lữ khách. Trận đầu này mình chỉ bạn cách chơi, mất khoảng một phút.','Bắt đầu');if(!alive())return;coachOff();
 let wm=T.wait('myturn');await sleep(250);if(!alive())return;doTurn('e',M.S.hands.e.findIndex(c=>c.id==='scarab'),5);await wm;if(!alive())return;
 await coach(()=>cellEls[5],'Đối thủ vừa đặt một lá, <b>viền đỏ</b> là bài địch. Mỗi lá có <b>4 số ở 4 cạnh</b>: trên, phải, dưới, trái.','Tiếp');if(!alive())return;
 wm=T.wait('myturn');
 M.pause=async()=>{M.pause=null;T.hand=T.cell=-1;T.place=false;await coach(()=>cellEls[5],'Lật được rồi! Lá này đổi sang <b>viền xanh</b>, giờ là của bạn.','Tiếp');coachOff()};
 await pickThenPlace(M.S.hands.p.findIndex(c=>c.id==='boar'),9,'Đặt vào ô sáng này, ngay dưới lá địch. Chạm vào ô, hoặc kéo lá thả vào.',
  'Hai cạnh chạm nhau: cạnh trên <b>5</b> của bạn lớn hơn cạnh dưới <b>4</b> của địch, nên lá địch sẽ bị lật. Bấm <b>Đặt bài</b>.');if(!alive())return;
 await wm;if(!alive())return;
 T.hand=T.cell=-1;T.place=false;
 await coach(()=>cellEls[9],'Đối thủ đánh trả: cạnh trên <b>5</b> của Cá Sấu Tàu Ngầm lớn hơn cạnh dưới <b>3</b> của Lợn Lò Hơi, nên lá của bạn bị lật lại. <b>Cạnh yếu dễ bị lật.</b>','Tiếp');if(!alive())return;
 let best=null,bs=-1e9;M.S.hands.p.forEach((c,hi)=>M.S.cells.forEach((x,i)=>{if(!isFree(x))return;const p=simMove(hi,i),sc=p.flips.length*10-p.risk*15;if(sc>bs){bs=sc;best={hi,i,p}}}));
 const fl=best.p.flips.length,safe=!best.p.risk,lbl=(fl?`<b>Lật ${fl}</b> là số lá sẽ lật được`:'')+(safe?(fl?', ':'')+'<b>an toàn</b> là đối thủ không lật lại được':'');
 M.pause=async()=>{M.pause=null;T.hand=T.cell=-1;T.place=false;
  await coach(null,'<b class="who">Giờ bạn tự đánh</b>Mỗi lượt đặt 1 lá. Kín bàn, ai giữ nhiều lá hơn thì thắng. Nhớ nhìn nhãn <b>Lật</b> và <b>an toàn</b> trên từng ô.','Đánh thôi');endTut()};
 await pickThenPlace(best.hi,best.i,lbl?`Khi đã chọn lá, mỗi ô ghi sẵn kết quả: ${lbl}. Đặt vào ô này.`:'Đặt vào ô này.','Bấm <b>Đặt bài</b>.')}

/* Mẹo theo ngữ cảnh trong trận, mỗi mẹo chỉ hiện một lần. */
async function matchTips(){if(!M||M.tut)return;
 const run=async(k,sel,txt)=>{if(SV.tips[k]||!M)return;T.on=true;T.hand=T.cell=-1;T.place=false;await coach(sel,txt,'Đã hiểu');SV.tips[k]=1;save();T.on=false;T.hand=T.cell=null;T.place=true;coachOff()};
 await sleep(600);
 if(M&&M.S.el)await run('el','#legend','Từ hành tinh này hệ có tác dụng: <b>Nhiệt thắng Sinh, Sinh thắng Lạnh, Lạnh thắng Nhiệt</b>. Đánh vào lá thuộc hệ bị khắc được +1, phần xem trước sẽ ghi dạng "4+1".');
 if(M&&M.S.el&&M.S.cells.some(c=>c.t!=='none'))await run('brk',()=>cellEls[M.S.cells.findIndex(c=>c.t!=='none')],'Mỗi hệ phá được một loại vật cản: <b>Nhiệt làm tan Khối Băng, Lạnh làm nguội Lò Quá Nhiệt, Sinh phân rã Đống Phế Liệu</b>. Đặt lá cạnh vật cản hợp hệ để phá, mỗi lần phá được xu.');
 for(const r of (M?M.S.rules:[]))if(M)await run('r_'+r,'#legend',`<b>Luật vùng: ${RULE[r].n}.</b> ${RULE[r].d}`);
 if(M&&M.S.hands.e.some(c=>CARDS[c.id].s))await run('skill','#ehand','Lá từ ★★ trở lên có <b>kỹ năng</b>. Chạm vào lá địch ở hàng này để đọc trước khi đánh.');
 if(M&&!$('#bBeer').hidden)await run('beer','#bBeer','Bí nước? Cắm <b>chip tiên tri</b>: nó chỉ lá nên đánh và ô nên đặt.')}

/* Mẹo ở sảnh khi mở khóa tính năng mới. */
let tipBusy=false;
async function homeTips(){if(tipBusy||$('#home').hidden||!$('#modal').hidden)return;tipBusy=true;
 try{if(!SV.tut){coach('.floor .go[data-i="0"]','<b class="who">Huyền Ấn</b>Chạm để vào trận đầu tiên. Mình sẽ chỉ bạn cách chơi.');return}
  const a=SV.lastAuto,steps=[[SV.stage>=1,'shop','#bShop','<b>Cửa hàng</b> đã mở. Mỗi ngày có quà và nhiệm vụ nhận xu.'],
   [SV.stage>=2,'deck','#bDeck',a?`<b>${CARDS[a.i].n}</b> đã tự vào bộ ra trận${a.o?` thay cho ${CARDS[a.o].n}`:''}. Vào <b>Bộ bài</b> để đổi lá khi muốn.`:'Vào <b>Bộ bài</b> để chọn 6 lá ra trận.'],
   [SV.stage>=2,'pack','#bGacha','<b>Mở gói</b> để có thêm lá. Gom đủ từng bộ trong <b>Album</b> sẽ có thưởng.']];
  ALBUM.forEach(st=>{if(setReady(st))steps.push([SV.stage>=2,'al_'+st.k,'#bGacha',`Bạn đã đủ <b>Bộ ${st.n}</b> trong Album. Vào <b>Mở gói</b> để nhận thưởng.`])});
  for(const[ok,k,sel,txt]of steps){if(!ok||SV.tips[k])continue;await coach(sel,txt,'Đã hiểu');SV.tips[k]=1;save();if($('#home').hidden)return}
  coachOff()}finally{tipBusy=false}}

/* Lá thưởng tự vào bộ ra trận, thay lá yếu nhất nếu đủ điểm. */
function autoSlot(c){fixDeck();if(SV.deck.includes(c.u))return;const need=cst(c);SV.lastAuto={i:c.id,o:null};
 if(SV.deck.length<6&&dcost()+need<=BUDGET){SV.deck.push(c.u);return save()}
 const out=SV.deck.map(byU).sort((a,b)=>cst(a)-cst(b)||sum(CARDS[a.id].v)-sum(CARDS[b.id].v)).find(x=>dcost()-cst(x)+need<=BUDGET&&cst(x)<need+1&&CARDS[x.id].r<=CARDS[c.id].r);
 if(out){SV.deck[SV.deck.indexOf(out.u)]=c.u;SV.lastAuto.o=out.id}else SV.lastAuto=null;save()}

/* Kéo thả lá từ tay vào ô. */
let drag=null,dragEnd=0;
$('#hand').addEventListener('pointerdown',e=>{const b=e.target.closest('.hc');if(!b||!M||M.busy||M.turn!=='p')return;drag={hi:+b.dataset.i,x:e.clientX,y:e.clientY,on:false,cell:null,id:e.pointerId}});
function dragClear(){if(!drag)return;if(drag.g)drag.g.remove();drag=null}
addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id||!M)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(!drag.on){if(dx*dx+dy*dy<120)return;if(M.busy||M.turn!=='p'){drag=null;return}if(T.on&&!T.okHand(drag.hi)){drag=null;return T.nudge()}
  drag.on=true;M.sel=drag.hi;M.prev=null;M.S.cells.forEach((c,j)=>renderCell(j,c));renderHand();markOk();$('#info').innerHTML=infoCard(M.S.hands.p[drag.hi],M.S.el);
  const g=document.createElement('div');g.id='dragGhost';g.innerHTML=cardHTML(M.S.hands.p[drag.hi]);document.body.append(g);drag.g=g;T.emit('sel',drag.hi)}
 drag.g.style.transform=`translate(${e.clientX}px,${e.clientY}px) translate(-50%,-75%) rotate(${Math.max(-12,Math.min(12,dx/14))}deg)`;
 const el=document.elementsFromPoint(e.clientX,e.clientY).find(x=>x.classList&&x.classList.contains('cell')),i=el?+el.dataset.i:null,ok=i!=null&&isFree(M.S.cells[i])&&(!T.on||T.okCell(i));
 if(ok&&i!==drag.cell){drag.cell=i;showPreview(i)}else if(!ok&&drag.cell!=null){drag.cell=null;M.prev=null;M.S.cells.forEach((c,j)=>renderCell(j,c));markOk()}});
addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;const d=drag;dragClear();if(!d.on)return;dragEnd=Date.now();
 if(d.cell!=null&&M&&!M.busy&&M.turn==='p')doTurn('p',d.hi,d.cell)});
addEventListener('pointercancel',()=>{if(drag&&drag.on)dragEnd=Date.now();dragClear()});

/* Hiệu ứng chữ lớn và chớp sáng. */
function bigTxt(t,c){const b=$('#board'),r=!$('#match').hidden&&b?b.getBoundingClientRect():{left:0,top:innerHeight*.3,width:innerWidth,height:0};const s=document.createElement('div');s.className='bigtxt';s.textContent=t;
 s.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;color:${c||'#bff8ff'}`;$('#fx').append(s);setTimeout(()=>s.remove(),1350)}
function flash(){const f=document.createElement('div');f.className='flash';document.body.append(f);setTimeout(()=>f.remove(),850)}
$('#legend').addEventListener('click',e=>{const b=e.target.closest('.rchip');if(b&&M)$('#info').innerHTML=`<span class="nm">Luật vùng: ${RULE[b.dataset.r].n}</span><div>${RULE[b.dataset.r].d}</div>`});
/* ================= ALBUM ================= */
/* Gom đủ một bộ lá thì nhận thưởng một lần. */
const ALBUM=[
 {k:'tro',n:'Nhiệt Hạch',e:'hoa',ids:['boar','rat','ant','cbat','ogre'],rw:{gold:200,beer:1}},
 {k:'dam',n:'Cực Lạnh',e:'thuy',ids:['scarab','croc','seahorse','mud','cuttle'],rw:{gold:200,beer:1}},
 {k:'rung',n:'Sinh Học',e:'moc',ids:['bear','stoat','falcon','horse','skel','yeti'],rw:{gold:250,beer:1}},
 {k:'san',n:'Thợ Săn',ids:['wolf','turtle','fox','snake','scorp','rscorp'],rw:{gold:400,charm:1}},
 {k:'hang',n:'Tổ Ngầm',ids:['spider','troll','naga','ghoul','shadow','rider'],rw:{gold:500,charm:1}},
 {k:'hinh',n:'Hình Dạng',ids:['gale','fguard','wose'],rw:{gold:600,beer:2}},
 {k:'vuc',n:'Khe Hư Không',ids:['bat','phoenix','lion','serpent','draug','tentacle'],rw:{gold:800,legend:1}},
 {k:'than',n:'Thần Thoại',ids:['dragon','deer','reaper','lich'],rw:{gold:3000,beer:5,charm:3}}];
const ownsId=id=>SV.col.some(c=>c.id===id),setHave=s=>s.ids.filter(ownsId).length,setReady=s=>setHave(s)===s.ids.length&&!SV.album[s.k];
const albumReady=()=>ALBUM.some(setReady);
const sigFloor=id=>OPPS.findIndex(o=>o&&!o.abyss&&o.sig&&o.sig.id===id);
function rwHTML(rw){return [rw.gold?`<div>${ic('coins')}<b>×${rw.gold}</b></div>`:'',rw.beer?`<div>${ic('beer')}<b>×${rw.beer}</b></div>`:'',rw.charm?`<div>${ic('charm')}<b>×${rw.charm}</b></div>`:'',rw.legend?`<div class="r3"><i>Huyền thoại</i>${ic('cpick')}<b>×1</b></div>`:''].join('')}
function renderAlbum(){const tot=ALBUM.reduce((a,s)=>a+s.ids.length,0),have=ALBUM.reduce((a,s)=>a+setHave(s),0);
 $('#cxTitle').innerHTML=`Album · ${have}/${tot} lá · ${ALBUM.filter(s=>SV.album[s.k]).length}/${ALBUM.length} bộ`;
 $('#codex').innerHTML=ALBUM.map(s=>{const h=setHave(s),done=SV.album[s.k],ready=setReady(s);
  return `<div class="aset${ready?' ready':''}${done?' done':''}"><div class="ahead">${s.e?ic(s.e):ic('book')}<b>Bộ ${s.n}</b><span class="acnt">${h}/${s.ids.length}</span></div>
  <div class="abar"><i style="width:${h/s.ids.length*100}%"></i></div>
  <div class="codex">${s.ids.map(id=>{const d=CARDS[id],own=ownsId(id),sf=sigFloor(id),hunt=!own&&sf>=0&&sf<=SV.stage&&!byR(d.r,SV.stage).includes(id),lock=!own&&!hunt&&(d.u||0)>SV.stage;
   return `<div class="cx${lock?' lock':own?'':' miss'}">${lock?backHTML:cardHTML(inst(id,'p'))}<span>${own?'':hunt?('Săn HT'+(sf+1)):lock?'Hành tinh '+(d.u+1):d.boss?'Boss':'Chưa có'}</span></div>`}).join('')}</div>
  <div class="arw"><span class="cap" style="margin:0">Thưởng</span><div class="loot sm">${rwHTML(s.rw)}</div>${done?'<span class="agot">Đã nhận</span>':`<button class="btn sm" data-set="${s.k}"${ready?'':' disabled'}>Nhận</button>`}</div></div>`}).join('')}
$('#codex').addEventListener('click',e=>{const b=e.target.closest('[data-set]');if(!b||b.disabled)return;const s=ALBUM.find(x=>x.k===b.dataset.set);if(!setReady(s))return;
 SV.album[s.k]=1;const rw=s.rw;SV.gold+=rw.gold||0;SV.beer+=rw.beer||0;SV.charm+=rw.charm||0;let leg=null;
 if(rw.legend){const pool=['dragon','deer'],miss=pool.filter(id=>!ownsId(id));leg=pick(miss.length?miss:pool);autoSlot(addCard(leg))}
 save();sfx('win');const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top,'#ffd76a',70);floatTxt(r.left+r.width/2,r.top,'Hoàn thành bộ '+s.n,'#bff8ff');
 if(leg)packModal([leg],'Thưởng bộ '+s.n,true);renderGacha()});
/* Nút Back của Android: đóng lớp trên cùng, về sảnh, hoặc thoát. */
window.hwBack=()=>{if(!$('#modal').hidden)return'stay';if(!$('#match').hidden){$('#bQuit').click();return'stay'}if($('#home').hidden){show('home');return'stay'}return'exit'};
show('home');
</script>
